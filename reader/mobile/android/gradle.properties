# Sized for a machine with ~8 GB RAM (Flutter template default is -Xmx8G)
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The project (E:) and the Pub cache with plugin sources (C:) are on different
# drives; Kotlin incremental caches cannot relate paths across drive roots on
# Windows and fail with "Could not close incremental caches".
kotlin.incremental=false
