<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reader — Track, discover and discuss books</title>
    <meta name="description" content="Track what you read, discover your next favorite book, join live book clubs and get AI-powered reading recommendations." />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09130D" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Reader" />
    <meta property="og:description" content="Track, discover and discuss books." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Connect early to the font and cover CDNs used on first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://covers.openlibrary.org" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />

    <!-- Apply the saved theme before first paint to avoid a light/dark flash -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>Reader needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
